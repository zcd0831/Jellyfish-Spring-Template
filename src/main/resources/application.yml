server:
  port: 8080

spring:
  application:
    name: jellyfish-spring-template

jellyfish:
  enabled: true
  process-name: jellyfish-spring-template

  # ── 路径：yml 只回答「那几份配置文件在哪」，内容仍然是内核格式的 JSON ──────────────────────
  # 三段的 global-path 都置成空串，表示「这一级不配置」。于是本示例只读 classpath 上自带的那份骨架，
  # 不会去读你 ~/.jellyfish/ 下的真实配置——否则「示例用的是哪个模型、哪个 key」会随机器而变。
  # 想改用本机那份（比如你已经配好了 deepseek）：把要用的那一段的 global-path 写回来，删掉 project-path。
  models:
    global-path: ''
    project-path: 'classpath:jellyfish/models.json'
  agents:
    global-path: ''
    project-path: 'classpath:jellyfish/agents.json'
  settings:
    global-path: ''
    project-path: 'classpath:jellyfish/jellyfish.json'

  plugins:
    # 插件 jar 放哪（平铺 jar 或「一插件一子目录」都行，不递归）。
    # 本示例在 jellyfish.json 里把启用名单声明成了空名单，因此这个目录里放什么都不会被加载。
    # 想加能力时：把插件 jar 丢进这个目录，再去 classpath:jellyfish/jellyfish.json 的 enabled 里写上插件 id。
    roots: [ '~/.jellyfish/plugins/' ]

  runtime:
    # 服务化外壳没有终端，插件据此降级
    interactive: false

  # 审批与提问都要业务侧提供界面才该打开。本示例不提供，因此都关闭：
  # 关闭时「需要审批的调用」立即按拒绝处理，提问立即返回「问不到人」——都不阻塞线程。
  approval:
    enabled: false
  ask:
    enabled: false

  lifecycle:
    # true = 上下文启动时自动拉起内核（bootstrap）。false 则只装配、由你自己决定时机
    bootstrap-on-start: true

  user:
    # 多用户护栏：本示例只用一个 demo 用户，但每用户并发 / 会话数配额与闲置回收照常生效
    enabled: true
    max-inflight-turns-per-user: 2
    max-sessions-per-user: 20
    reaper-enabled: true
    idle-timeout: 30m
    sweep-interval: 5m

logging:
  level:
    # 内核的启动过程值得看一眼：它会打印插件加载结果、配置装载告警等
    zcd.jellyfish: info
